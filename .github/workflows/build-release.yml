# Osmonauts – builds both firmwares and runs the simulation tests:
#   firmware/osmonauts_controller  Arduino Uno / Nano / Mega
#   firmware/osmonauts_esp32       ESP32 4-relay board
# Both share the core in firmware/common (copied into src/ by tools/sync_common.py).
# A tag "vX.Y" (equal to FW_VERSION in the sketch) additionally creates a GitHub release with
#   osmonauts-uno.hex, osmonauts-mega.hex, osmonauts-esp32-relay4.bin (update),
#   osmonauts-esp32-relay4-full.bin (first flash, address 0x0) and ping-esp32-relay4.json.
# ESP32 controllers download ping-esp32-relay4.json once a day (update check) - the download
# counter of this file is the anonymous number of active devices.
#
# New release:  set FW_VERSION in firmware/common/osmo_core.h, run tools/sync_common.py, commit, then
#               git tag v6.2 && git push origin v6.2
name: Build & release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  ESP32_CORE: "3.3.12"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shared core in sync
        run: python3 tools/sync_common.py --check

      - name: Simulation tests
        run: |
          ALL="tap tap2 stop stopfilter disinfect busy filterchange auto tapduringauto tapduringpost aquastop bounce filter"
          tests/run.sh config_elias.h $ALL
          tests/run.sh ../osmonauts_esp32/config_esp32_relay4.h $ALL

      - uses: arduino/setup-arduino-cli@v2

      - name: Install cores and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr "esp32:esp32@${ESP32_CORE}"
          arduino-cli lib install "WiFiManager@2.0.17" "ESP Async WebServer@3.12.1" "Async TCP@3.6.1" \
            "Adafruit NeoPixel" "Adafruit SSD1306" "Adafruit GFX Library" "Adafruit BusIO"

      - name: Compile
        run: |
          mkdir -p dist
          arduino_build() {   # arduino_build <config> <fqbn> <name>   (Arduino sketch with the chosen config)
            W="$RUNNER_TEMP/$3/osmonauts_controller"; mkdir -p "$RUNNER_TEMP/$3"
            cp -r firmware/osmonauts_controller "$W"
            sed -i "s|^#include \"config.h\".*|#include \"$1\"|" "$W/osmonauts_controller.ino"
            arduino-cli compile -b "$2" --warnings default --output-dir "$RUNNER_TEMP/$3/out" "$W"
          }
          arduino_build config.h       arduino:avr:uno                  uno
          arduino_build config_elias.h arduino:avr:uno                  elias
          arduino_build config_kai.h   arduino:avr:mega:cpu=atmega2560  mega
          arduino-cli compile -b esp32:esp32:esp32:PartitionScheme=min_spiffs --warnings default \
            --output-dir "$RUNNER_TEMP/esp32-relay4/out" firmware/osmonauts_esp32
          cp "$RUNNER_TEMP/uno/out/osmonauts_controller.ino.hex"             dist/osmonauts-uno.hex
          cp "$RUNNER_TEMP/mega/out/osmonauts_controller.ino.hex"            dist/osmonauts-mega.hex
          cp "$RUNNER_TEMP/esp32-relay4/out/osmonauts_esp32.ino.bin"         dist/osmonauts-esp32-relay4.bin
          cp "$RUNNER_TEMP/esp32-relay4/out/osmonauts_esp32.ino.merged.bin"  dist/osmonauts-esp32-relay4-full.bin
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -oP '#define FW_VERSION\s+"\K[^"]+' firmware/common/osmo_core.h)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match FW_VERSION $VERSION in the sketch"; exit 1
          fi
          BIN=dist/osmonauts-esp32-relay4.bin
          printf '{"version":"%s","variant":"esp32-relay4","bin":"https://github.com/%s/releases/download/%s/osmonauts-esp32-relay4.bin","sha256":"%s","size":%s}\n' \
            "$VERSION" "$REPO" "$TAG" "$(sha256sum $BIN | cut -d' ' -f1)" "$(stat -c%s $BIN)" > dist/ping-esp32-relay4.json
          cat dist/ping-esp32-relay4.json
          cat > notes.md <<EOF
          Osmonauts – OpenOsmosis Controller $TAG · Kai Mommsen & Elias Dörre · CC BY-NC-SA 4.0

          | File | Board | Use |
          |---|---|---|
          | osmonauts-esp32-relay4.bin | ESP32 4-relay board | update via web interface |
          | osmonauts-esp32-relay4-full.bin | ESP32 4-relay board | first flash at address 0x0 (esptool / web flasher) |
          | osmonauts-uno.hex | Arduino Uno/Nano with config.h | upload with avrdude / XLoader |
          | osmonauts-mega.hex | Arduino Mega with config_kai.h | upload with avrdude |

          ping-esp32-relay4.json is the update manifest that ESP32 controllers check once a day.
          EOF
          gh release create "$TAG" dist/* --repo "$REPO" --title "Osmonauts $TAG" --notes-file notes.md
